  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;600;700&family=Permanent+Marker&family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe6;
      --ink: #171515;
      --terracotta: #c66a4a;
      --moss: #78845a;
      --burgundy: #742d3d;
      --white: #fffdf7;
      --panel: #fbf3e4;
      --line: 2px solid var(--ink);
      --display: "Bagel Fat One", Georgia, serif;
      --marker: "Permanent Marker", Impact, sans-serif;
      --hand: "Caveat", cursive;
      --body: "Spectral", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(rgba(23, 21, 21, .10) .7px, transparent .7px);
      background-size: 13px 13px;
      font: 17px/1.6 var(--body);
    }
    a { color: inherit; }
    :focus-visible { outline: 4px solid var(--terracotta); outline-offset: 4px; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .site-header { position: sticky; z-index: 5; top: 0; background: rgba(244,239,230,.95); border-bottom: var(--line); backdrop-filter: blur(10px); }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font: 400 1.3rem/1 var(--display); text-decoration: none; }
    .back-link { padding: 8px 14px; background: var(--moss); border: var(--line); box-shadow: 3px 3px 0 var(--ink); font: 400 1rem/1.2 var(--marker); text-decoration: none; }
    main { min-height: calc(100vh - 150px); padding: 72px 0 90px; }
    .intro { max-width: 760px; margin: 0 auto 48px; text-align: center; }
    .eyebrow { margin-bottom: 8px; color: var(--burgundy); font: 700 1.3rem/1 var(--hand); }
    .intro > p:last-child { margin: 0; font-size: 1.1rem; }

    /* Nome da linguagem circulado por uma linha que se desenha, como traço de caneta */
    .title-wrap { position: relative; display: inline-block; margin: 6px 0 14px; padding: .3em .55em; font-size: clamp(2rem, 6vw, 3.6rem); }
    h1 { margin: 0; font: 400 1em/1 var(--display); white-space: nowrap; }
    .title-letter { display: inline-block; }
    h1 .title-letter { animation: letter-rise .5s ease backwards; animation-delay: calc(var(--i) * 45ms); }
    @keyframes letter-rise { from { opacity: 0; transform: translateY(18px); } }
    .title-circle { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--terracotta); stroke-width: 3.5; stroke-linecap: round; transform: rotate(-1.5deg); pointer-events: none; }
    .title-circle path { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw-circle 1.6s .35s ease-out forwards; }
    @keyframes draw-circle { to { stroke-dashoffset: 0; } }
    @keyframes letter-wave { 0%, 60%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-10px) rotate(-4deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Abas de fichário: uma por empresa, coloridas e meio tortas; a aberta se endireita e encaixa no painel */
    .tabs { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 10px; margin-bottom: -2px; padding: 14px 26px 0; overflow-x: auto; scrollbar-width: none; }
    .tab {
      --tab-bg: var(--terracotta);
      --tilt: -2.5deg;
      position: relative; flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
      padding: 12px 24px 12px 20px; color: var(--white); background: var(--tab-bg);
      border: var(--line); border-bottom: 0; border-radius: 20px 34px 0 0;
      font: inherit; text-align: left; cursor: pointer;
      transform: translateY(9px) rotate(var(--tilt)); transform-origin: 50% 100%;
      transition: transform .3s cubic-bezier(.2, 1.5, .4, 1), background-color .25s ease, color .25s ease;
    }
    .tab:nth-child(even) { --tab-bg: var(--moss); --tilt: 2deg; border-radius: 32px 18px 0 0; }
    .tab:nth-child(3n) { --tab-bg: var(--burgundy); --tilt: -1deg; border-radius: 26px 26px 0 0; }
    /* Costura tracejada por dentro da aba */
    .tab::before { content: ""; position: absolute; inset: 5px 5px 0; border: 1.5px dashed rgba(255,253,247,.55); border-bottom: 0; border-radius: inherit; pointer-events: none; }
    .tab:hover { transform: translateY(3px) rotate(calc(var(--tilt) / 2)); }
    .tab-name { font: 400 clamp(1.25rem, 3vw, 1.7rem)/1 var(--display); white-space: nowrap; }
    .tab-count { font: 400 .85rem/1 var(--marker); opacity: .85; }
    /* Com muitas abas (como as peças de Teatro), elas ficam menores para caber lado a lado */
    .tabs:has(.tab:nth-child(5)) { gap: 6px; padding-inline: 18px; }
    .tabs:has(.tab:nth-child(5)) .tab { padding: 10px 16px 10px 14px; }
    .tabs:has(.tab:nth-child(5)) .tab-name { font-size: 1.12rem; }
    .tabs:has(.tab:nth-child(5)) .tab-count { font-size: .72rem; }
    .tab[aria-selected="true"] { z-index: 2; color: var(--ink); background: var(--panel); transform: none; padding-bottom: 16px; }
    .tab[aria-selected="true"]::before { border-color: rgba(23,21,21,.3); }
    .tab[aria-selected="true"] .tab-count { color: var(--burgundy); opacity: 1; }
    /* Estrelinha girando na aba aberta */
    .tab[aria-selected="true"]::after { content: "✳"; position: absolute; top: -14px; right: -10px; color: var(--terracotta); font: 400 1.6rem/1 var(--marker); text-shadow: 1px 1px 0 var(--ink); animation: spin 6s linear infinite; }
    .has-tabs {
      position: relative; padding: 34px 28px 30px; background: var(--panel);
      border: var(--line); border-radius: 8px 40px 30px 44px; box-shadow: 8px 10px 0 var(--terracotta);
    }
    .has-tabs .company-heading { display: none; }
    .tab-empty { padding: 56px 16px 60px; text-align: center; }
    .tab-empty-name { margin: 0; font: 400 clamp(2rem, 5vw, 3rem)/1.05 var(--display); text-shadow: 3px 3px 0 var(--terracotta); }
    .tab-empty-note { margin: 12px 0 0; color: var(--burgundy); font: 700 1.5rem/1.2 var(--hand); }
    .has-tabs .company-section.is-visible .work-card { animation: card-in .45s ease backwards; }
    .has-tabs .company-section.is-visible .work-card:nth-child(3n+2) { animation-delay: .06s; }
    .has-tabs .company-section.is-visible .work-card:nth-child(3n) { animation-delay: .12s; }
    @keyframes card-in { from { opacity: 0; transform: translateY(16px); } }
    .company-section { margin-top: 52px; scroll-margin-top: 96px; }
    .company-section:first-child { margin-top: 0; }
    .company-section[hidden] { display: none; }
    /* Num link direto (#fantastic), deixa as abas visíveis acima das fotos */
    .has-tabs .company-section { margin-top: 0; scroll-margin-top: 200px; }
    /* Linha que se desenha e "puxa" o nome da empresa */
    .company-heading { position: relative; display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; padding-bottom: 14px; }
    .company-line { position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: var(--ink); border-radius: 3px; }
    .company-line::after { content: "✳"; position: absolute; right: -12px; top: -12px; color: var(--terracotta); font: 400 1.5rem/1 var(--marker); text-shadow: 1px 1px 0 var(--ink); animation: spin 6s linear infinite; }
    .company-section.is-visible .company-line { animation: line-pull 1.1s cubic-bezier(.65, 0, .35, 1) forwards; }
    @keyframes line-pull { to { width: 100%; } }
    .company-heading h2 { margin: 0; opacity: 0; font: 400 clamp(2.2rem, 5vw, 3.4rem)/1 var(--display); }
    .company-section.is-visible .company-heading h2 { opacity: 1; animation: name-pull .9s .15s cubic-bezier(.2, 1.4, .4, 1) backwards; }
    @keyframes name-pull { from { opacity: 0; transform: translateX(-70px) skewX(-14deg); } }
    .company-heading h2 .title-letter { text-shadow: 3px 3px 0 var(--terracotta); animation: letter-wave 3.6s ease-in-out infinite; animation-delay: calc(1.4s + var(--i) * 90ms); }
    .company-heading p { margin: 0; color: var(--burgundy); font: 400 1.1rem/1 var(--marker); }
    .company-section.is-visible .company-heading p { animation: fade-in .5s .9s backwards; }
    @keyframes fade-in { from { opacity: 0; } }
    .work-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 24px; }
    .work-card {
      min-width: 0;
      overflow: hidden;
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 28px 72px 26px 58px;
      box-shadow: 6px 8px 0 var(--terracotta);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .work-card:nth-child(even) { border-radius: 72px 26px 58px 28px; }
    .work-card:nth-child(3n) { border-radius: 54px 34px 72px 22px; }
    .work-card:hover { transform: translateY(-5px) rotate(-.5deg); box-shadow: 8px 13px 0 var(--terracotta); }
    .work-visual {
      aspect-ratio: 4 / 5;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 28%, rgba(198,106,74,.92) 0 10%, transparent 10.5%),
        radial-gradient(circle at 76% 70%, rgba(116,45,61,.78) 0 18%, transparent 18.5%),
        linear-gradient(145deg, var(--moss), var(--terracotta));
      text-align: center;
    }
    .work-visual img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .work-visual::after { content: ""; position: absolute; inset: 10px; border: 1px dashed rgba(23,21,21,.65); border-radius: 20px 48px 18px 38px; pointer-events: none; }
    .work-card:nth-child(even) .work-visual::after { border-radius: 48px 18px 38px 20px; }
    .work-card:nth-child(3n) .work-visual::after { border-radius: 38px 22px 48px 16px; }
    .work-info { padding: 16px; }
    .work-info h3 { margin: 0; font: 600 1.35rem/1.2 var(--body); }
    .context { margin: 7px 0 0; color: var(--burgundy); font: 400 1rem/1.2 var(--marker); }
    .work-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
    .work-grid + .work-list { margin-top: 24px; }
    .work-list li { min-height: 76px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--white); border: var(--line); border-radius: 18px 34px 16px 28px; box-shadow: 4px 4px 0 var(--terracotta); font: 600 1.2rem/1.25 var(--body); }
    .work-list li:nth-child(even) { border-radius: 34px 16px 28px 18px; }
    .work-list li::before { content: "✳"; flex: none; color: var(--burgundy); font: 400 1.3rem/1 var(--marker); }
    .empty { max-width: 600px; margin: 0 auto; text-align: center; }
    .empty[hidden] { display: none; }
    .empty a { display: inline-block; margin: 8px; }
    .site-footer { padding: 24px 0; color: var(--white); background: var(--ink); }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .footer p { margin: 0; }
    .footer a { color: var(--white); }
    .shine-target { position: relative; isolation: isolate; }
    .shine-target::after { content: ""; position: absolute; z-index: 3; inset: -30% auto -30% -75%; width: 48%; pointer-events: none; opacity: 0; transform: skewX(-22deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
    .shine-target:hover::after, .shine-target:focus-visible::after { opacity: 1; animation: shine-sweep .7s ease forwards; }
    @keyframes shine-sweep { to { left: 135%; } }
    .custom-cursor { display: none; }
    @media (hover: hover) and (pointer: fine) {
      body.has-custom-cursor, body.has-custom-cursor a, body.has-custom-cursor .tab { cursor: none; }
      .custom-cursor { display: grid; position: fixed; z-index: 10; top: 0; left: 0; width: 38px; height: 38px; place-items: center; pointer-events: none; opacity: 0; border: 2px solid var(--terracotta); border-radius: 50%; background: rgba(244,239,230,.22); box-shadow: 0 0 12px rgba(198,106,74,.7), inset 0 0 10px rgba(255,253,247,.6); transform: translate3d(-100px,-100px,0) translate(-50%,-50%); transition: width .2s ease, height .2s ease, background-color .2s ease, box-shadow .2s ease, opacity .15s ease; }
      .custom-cursor.is-visible { opacity: 1; }
      .custom-cursor.is-hovering { width: 54px; height: 54px; background: rgba(120,132,90,.24); box-shadow: 0 0 22px rgba(255,253,247,.8), 0 0 36px rgba(198,106,74,.6); }
      .cursor-core { width: 7px; height: 7px; border-radius: 50%; background: var(--burgundy); box-shadow: 0 0 8px var(--white); }
      .cursor-spark { position: absolute; top: -8px; right: -6px; color: var(--terracotta); font-size: 16px; text-shadow: 0 0 8px var(--white); }
    }
    @media (max-width: 760px) { .work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) {
      .wrap { width: min(100% - 30px, 1120px); }
      main { padding: 55px 0 70px; }
      .work-grid { grid-template-columns: 1fr; gap: 20px; }
      .company-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
      .tabs { gap: 6px; padding: 14px 10px 0; }
      .tab { padding: 9px 16px 9px 14px; }
      .tab-count { font-size: .72rem; }
      .has-tabs { padding: 22px 14px 20px; border-radius: 8px 28px 22px 30px; }
      .footer { align-items: flex-start; flex-direction: column; }
      .brand { font-size: 1.05rem; }
      .back-link { font-size: .85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .shine-target:hover::after, .shine-target:focus-visible::after { animation: none; opacity: .3; }
      .work-card:hover { transform: none; }
    }
  </style>
</head>

    const tipo = new URLSearchParams(window.location.search).get("tipo")?.toLowerCase();
    const linguagem = trabalhosPorLinguagem[tipo];
    const grid = document.querySelector("#work-grid");
    const invalidCategory = document.querySelector("#invalid-category");

    // Separa o texto em letras animáveis; o leitor de tela continua lendo o nome inteiro.
    const splitLetters = (element, text) => {
      element.textContent = "";
      element.setAttribute("aria-label", text);
      element.style.setProperty("--len", text.length);
      [...text].forEach((char, index) => {
        const letter = document.createElement("span");
        letter.className = "title-letter";
        letter.setAttribute("aria-hidden", "true");
        letter.style.setProperty("--i", index);
        letter.textContent = char === " " ? " " : char;
        element.append(letter);
      });
    };
    const pageTitle = document.querySelector("#page-title");

    if (linguagem) {
      document.title = `${linguagem.nome} | Walquíria Meireles`;
      pageTitle.textContent = linguagem.nome;
      document.querySelector("#page-description").textContent = linguagem.descricao;
      // Toda aba aparece, mesmo ainda sem fotos; sem abas, a lista só aparece se tiver algum trabalho.
      const grupos = linguagem.abas
        ? linguagem.abas.map((aba) => ({ nome: aba.nome, itens: aba.itens }))
        : [{ nome: linguagem.nome, itens: linguagem.itens }].filter((grupo) => grupo.itens.length);
      const plural = (total, singular, varios) => `${total} ${total === 1 ? singular : varios}`;
      // "Go! Entretenimento" -> "go-entretenimento", usado no endereço (#fantastic) de cada aba.
      const slug = (text) => text.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

      // Com abas, a página mostra uma aba por empresa ou peça, como divisórias de fichário; cada aba abre só os trabalhos dela.
      let tabList;
      if (linguagem.abas) {
        tabList = document.createElement("div");
        tabList.className = "tabs";
        tabList.setAttribute("role", "tablist");
        tabList.setAttribute("aria-label", linguagem.rotuloAbas);
        grid.before(tabList);
        grid.classList.add("has-tabs");
      }

      grupos.forEach((grupo) => {
        const comFoto = grupo.itens.filter((trabalho) => trabalho.imagem);
        const semFoto = grupo.itens.filter((trabalho) => !trabalho.imagem);
        const companySection = document.createElement("section");
        companySection.className = "company-section";
        const resumo = [
          comFoto.length && plural(comFoto.length, "foto", "fotos"),
          semFoto.length && plural(semFoto.length, "trabalho", "trabalhos")
        ].filter(Boolean).join(" · ") || "fotos em breve";

        if (tabList) {
          companySection.id = slug(grupo.nome);
          companySection.hidden = true;
          companySection.setAttribute("role", "tabpanel");
          companySection.setAttribute("aria-labelledby", `aba-${companySection.id}`);
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "tab";
          tab.id = `aba-${companySection.id}`;
          tab.dataset.empresa = companySection.id;
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", "false");
          tab.setAttribute("aria-controls", companySection.id);
          const tabName = document.createElement("span");
          tabName.className = "tab-name";
          tabName.textContent = grupo.nome;
          const tabCount = document.createElement("span");
          tabCount.className = "tab-count";
          tabCount.textContent = resumo;
          tab.append(tabName, tabCount);
          tabList.append(tab);
        }

        // Sem abas, o título do grupo repetiria o nome da linguagem.
        if (linguagem.abas) {
          const companyHeading = document.createElement("header");
          companyHeading.className = "company-heading";
          const companyTitle = document.createElement("h2");
          splitLetters(companyTitle, grupo.nome);
          const companyLine = document.createElement("span");
          companyLine.className = "company-line";
          companyLine.setAttribute("aria-hidden", "true");
          const count = document.createElement("p");
          count.textContent = resumo;
          companyHeading.append(companyTitle, count, companyLine);
          companySection.append(companyHeading);
        }

        if (comFoto.length) {
          const companyGrid = document.createElement("div");
          companyGrid.className = "work-grid";
          comFoto.forEach((trabalho) => {
            const card = document.createElement("article");
            card.className = "work-card shine-target";
            const visual = document.createElement("div");
            visual.className = "work-visual";
            const image = document.createElement("img");
            image.src = trabalho.imagem;
            image.alt = trabalho.descricao;
            image.loading = "lazy";
            image.decoding = "async";
            visual.append(image);
            const info = document.createElement("div");
            info.className = "work-info";
            if (trabalho.titulo) {
              const title = document.createElement("h3");
              title.textContent = trabalho.titulo;
              info.append(title);
            }
            const caption = document.createElement("p");
            caption.className = "context";
            caption.textContent = grupo.nome;
            info.append(caption);
            card.append(visual, info);
            companyGrid.append(card);
          });
          companySection.append(companyGrid);
        }

        // Trabalhos ainda sem foto aparecem como lista de títulos, sem caixas vazias.
        if (semFoto.length) {
          const list = document.createElement("ul");
          list.className = "work-list";
          semFoto.forEach((trabalho) => {
            const item = document.createElement("li");
            item.textContent = trabalho.titulo;
            list.append(item);
          });
          companySection.append(list);
        }

        // Aba ainda sem nenhum registro: mostra o nome da peça no painel.
        if (!grupo.itens.length) {
          const empty = document.createElement("div");
          empty.className = "tab-empty";
          const emptyName = document.createElement("p");
          emptyName.className = "tab-empty-name";
          emptyName.textContent = grupo.nome;
          const emptyNote = document.createElement("p");
          emptyNote.className = "tab-empty-note";
          emptyNote.textContent = "Fotos em breve";
          empty.append(emptyName, emptyNote);
          companySection.append(empty);
        }
        grid.append(companySection);
      });
    } else {
      grid.hidden = true;
      invalidCategory.hidden = false;
    }
    splitLetters(pageTitle, pageTitle.textContent);

    // Abre a aba de uma empresa: mostra só a seção dela.
    const tabs = [...document.querySelectorAll(".tab")];
    const openCompany = (id) => {
      const section = document.getElementById(id);
      if (!section || !section.classList.contains("company-section")) return false;
      document.querySelectorAll(".company-section").forEach((other) => {
        other.hidden = other !== section;
        other.classList.remove("is-visible");
      });
      tabs.forEach((tab) => {
        const selected = tab.dataset.empresa === id;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      void section.offsetWidth; // reinicia a entrada das fotos ao trocar de aba
      section.classList.add("is-visible");
      return true;
    };
    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => {
        history.replaceState(null, "", `#${tab.dataset.empresa}`);
        openCompany(tab.dataset.empresa);
      });
      // Setas do teclado passam de uma aba para outra.
      tab.addEventListener("keydown", (event) => {
        const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
        if (!step) return;
        const next = tabs[(index + step + tabs.length) % tabs.length];
        next.focus();
        next.click();
      });
    });
    // Um link como linguagem.html?tipo=performance#fantastic já abre a aba da Fantastic; sem isso, abre a primeira aba que tem fotos.
    if (tabs.length && !(location.hash && openCompany(decodeURIComponent(location.hash.slice(1))))) {
      const comFotos = tabs.find((tab) => document.getElementById(tab.dataset.empresa).querySelector(".work-grid"));
      openCompany((comFotos || tabs[0]).dataset.empresa);
    }

    document.querySelector("#current-year").textContent = new Date().getFullYear();
    document.querySelectorAll("a").forEach((link) => link.classList.add("shine-target"));

    const customCursor = document.querySelector(".custom-cursor");
    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      document.body.classList.add("has-custom-cursor");
      document.addEventListener("pointermove", (event) => {
        customCursor.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0) translate(-50%, -50%)`;
        customCursor.classList.add("is-visible");
      });
      document.addEventListener("pointerover", (event) => {
        if (event.target instanceof Element && event.target.closest("a, .work-card, .tab")) {
          customCursor.classList.add("is-hovering");
        }
      });
      document.addEventListener("pointerout", (event) => {
        if (!(event.relatedTarget instanceof Element)) {
          customCursor.classList.remove("is-visible", "is-hovering");
        } else if (!event.relatedTarget.closest("a, .work-card, .tab")) {
          customCursor.classList.remove("is-hovering");
        }
      });
    }
  </script>
</body>
</html>
